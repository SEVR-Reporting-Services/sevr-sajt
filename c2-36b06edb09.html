<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vatsson · Mina underlag (auto, paus vid hover)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --card:#ffffff; --foreground:#030712;
    --muted-foreground:#64748b; --accent:#e2e8f0;
    --border:#e8edf3; --border-strong:#e2e8f0; --ring:#cbd5e1;
    --primary:#1d4ed8; --icon:#94a3b8; --enc:#16a34a; --radius:14px; --rowH:52px;
    --band:#f6f8fb;
    --shadow:none;              /* ren bakgrund — ingen skugga */
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent}
  body{background:transparent;display:flex;align-items:flex-start;justify-content:center;
    min-height:100%;overflow:hidden;font-family:var(--sans);color:var(--foreground);-webkit-font-smoothing:antialiased}
  .modal{position:relative;width:340px;background:var(--card);
    border:1px solid var(--border-strong);border-radius:var(--radius);
    box-shadow:var(--shadow);
    transform-origin:top center}
  .inner{border-radius:var(--radius);overflow:hidden}
  .head{position:relative;padding:13px 15px 12px;border-bottom:1px solid var(--border)}
  .title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .subtitle{font-size:10.5px;color:var(--muted-foreground);margin-top:2px;line-height:1.35}
  .x{position:absolute;top:12px;right:13px;color:var(--icon);display:flex}
  .viewport{height:calc(var(--rowH) * 2);overflow:hidden;position:relative}
  .track{will-change:transform}
  .row{height:var(--rowH);display:flex;align-items:center;gap:11px;padding:0 15px;border-top:1px solid var(--border)}
  .track .row:first-child{border-top:none}
  .cbx{width:15px;height:15px;border-radius:4px;flex:none;border:1.5px solid var(--ring);background:#fff}
  .cbx.proc{background:#e2e8f0;border-color:#e2e8f0;display:flex;align-items:center;justify-content:center}
  .cbx.proc::after{content:"";width:6px;height:2px;background:#94a3b8;border-radius:2px}
  .meta{flex:1;min-width:0}
  .fname{font-size:12.5px;font-weight:600;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fmeta{font-size:10px;color:var(--muted-foreground);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;align-items:center;gap:9px;flex:none;color:var(--icon)}
  .stat{width:66px;display:flex;align-items:center;justify-content:flex-end;gap:6px;overflow:hidden}
  .pt{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
  .spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .saved{font-size:9px;font-weight:600;color:var(--enc);opacity:0;transition:opacity .4s ease;white-space:nowrap}
  .saved.show{opacity:1}
  .lock{display:flex;color:var(--icon);transition:color .6s ease, filter .6s ease}
  .lock.enc{color:var(--enc);filter:drop-shadow(0 0 5px rgba(22,163,74,.5));animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
  .kebab{display:flex;color:var(--icon)}
  .trust{display:flex;align-items:center;gap:6px;padding:7px 15px;background:var(--band);
    border-top:1px solid var(--border);font-size:9px;color:#9aa6b6}
  .trust svg{color:#9aa6b6}
  .flag{width:13px;height:9px;border-radius:1.5px;flex:none}
  .foot{position:relative;display:flex;align-items:center;justify-content:space-between;
    padding:9px 15px;background:#fff}
  .upload{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;
    color:#334155;padding:5px 8px;border-radius:8px;transition:background .25s;white-space:nowrap}
  .upload.flash{background:#eef2ff}
  .upload svg{color:#475569}
  .ripple{position:absolute;border-radius:50%;background:rgba(29,78,216,.18);transform:translate(-50%,-50%) scale(0);pointer-events:none}
  .ripple.go{animation:rip .5s ease-out}
  @keyframes rip{from{transform:translate(-50%,-50%) scale(0);opacity:.7}to{transform:translate(-50%,-50%) scale(5);opacity:0}}
  .bifoga{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;color:#a3adbb;
    font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px}
  .cursor{position:absolute;left:0;top:0;width:21px;height:21px;z-index:10;pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));transform:translate(120px,60px)}
  /* HOVER = PAUS: frys även CSS-animationerna */
  .modal.paused .spin,.modal.paused .lock,.modal.paused .ripple{animation-play-state:paused}
</style>
</head>
<body>
  <div class="modal" id="modal">
    <div class="inner">
      <div class="head">
        <div class="title">Mina underlag</div>
        <div class="subtitle">Välj eller ladda upp underlag att bifoga till chatten</div>
        <div class="x"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
      </div>
      <div class="viewport"><div class="track" id="track"></div></div>
      <div class="trust">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        GDPR · lagras i Sverige
        <svg class="flag" viewBox="0 0 16 10"><rect width="16" height="10" fill="#005293"/><rect x="5" width="2" height="10" fill="#fecb00"/><rect y="4" width="16" height="2" fill="#fecb00"/></svg>
      </div>
      <div class="foot">
        <span class="upload" id="upload">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Ladda upp ny fil
          <span class="ripple" id="ripple"></span>
        </span>
        <span class="bifoga">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.4 17.05a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg>
          Bifoga
        </span>
      </div>
    </div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24" fill="#fff" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"><path d="M5 3.2 L5 19 L9 15.2 L11.6 20.6 L14 19.5 L11.5 14.2 L17.2 14 Z"/></svg>
  </div>
<script>
const FILES=[
  {n:"Huvudbok_2025.SIE",m:"SIE · 0,3 MB"},
  {n:"Lönebesked_juni.pdf",m:"PDF · 88 KB · 1 sida"},
  {n:"Kontoutdrag_juli.pdf",m:"PDF · 140 KB · 2 sidor"},
  {n:"Verifikationer_Q2.csv",m:"CSV · 64 KB"},
  {n:"Balansrapport_2024.pdf",m:"PDF · 180 KB · 2 sidor"},
  {n:"Momsrapport_Q2.pdf",m:"PDF · 210 KB · 3 sidor"},
];
const ROW_H=52;
const track=document.getElementById('track'),modal=document.getElementById('modal'),
  uploadBtn=document.getElementById('upload'),ripple=document.getElementById('ripple'),cursor=document.getElementById('cursor');

/* AUTO-VARIANT: animationen går hela tiden och PAUSAS när muspekaren är över kortet.
   Paus = riktig frys (klockan står still), mouseleave = fortsätt exakt där den stannade. */
let paused=false;

/* --- Framer-hygien: pausa BARA när fliken är dold.
   (IntersectionObserver togs bort: i Framers preview/canvas rapporterar den ofta
    isIntersecting=false fast kortet syns → animationen frös.) --- */
var offscr=false;
document.addEventListener('visibilitychange',function(){offscr=document.hidden;});

function sleep(ms){                      // väntar bara när vi inte är pausade
  return new Promise(res=>{let t=0;const step=()=>{
    if(t>=ms) return res();
    setTimeout(()=>{ if(!paused&&!offscr) t+=60; step(); },60);};step();});
}
let fi=0;const nextFile=()=>FILES[fi++%FILES.length];
const lockSvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const kebab='<span class="kebab"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></span>';
const statResting=()=>'<span class="lock">'+lockSvg+'</span>';
const statProcessing=()=>'<span class="spin"></span><span class="pt">0%</span>';
const statDone=(flash)=>'<span class="saved'+(flash?' show':'')+'">Säkrad</span><span class="lock'+(flash?' enc':'')+'">'+lockSvg+'</span>';
function makeRow(f,active){const row=document.createElement('div');row.className='row';
  row.innerHTML='<div class="cbx'+(active?' proc':'')+'"></div><div class="meta"><div class="fname">'+f.n+'</div><div class="fmeta">'+f.m+'</div></div><div class="actions"><div class="stat">'+(active?statProcessing():statResting())+'</div>'+kebab+'</div>';return row;}
let offset=0;
function setOffset(v,a){track.style.transition=a?'transform .5s cubic-bezier(.4,.2,.2,1)':'none';track.style.transform='translateY(-'+v+'px)';}
function moveCursor(x,y,s,d){cursor.style.transition='transform '+d+'ms cubic-bezier(.5,.1,.2,1)';cursor.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';}
async function processRow(row){
  const stat=row.querySelector('.stat'), pt=row.querySelector('.pt');
  await sleep(300);
  for(let p=0;p<=100;p+=4){pt.textContent=p+"%";await sleep(58);}
  await sleep(160);
  row.querySelector('.cbx').classList.remove('proc');
  stat.innerHTML=statDone(true);
  const lk=stat.querySelector('.lock'), lb=stat.querySelector('.saved');
  await sleep(1300);
  if(lk)lk.classList.remove('enc'); if(lb)lb.classList.remove('show');
}
/* FILL WIDTH som en bild: fyller ramens bredd, toppförankrad. ZOOM = finjustering. */
const ZOOM=1;
let curK=1;
function fit(){const cw=window.innerWidth,sw=modal.offsetWidth;
  curK=(cw/sw)*ZOOM;modal.style.transform='scale('+curK+')';}
var _rzT=0,_lastW=window.innerWidth;
window.addEventListener('resize',function(){
  if(window.innerWidth===_lastW)return; _lastW=window.innerWidth;
  clearTimeout(_rzT);_rzT=setTimeout(fit,120);});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
setTimeout(fit,200);
function targetXY(){const mr=modal.getBoundingClientRect(),br=uploadBtn.getBoundingClientRect();
  return{x:(br.left-mr.left)/curK+40,y:(br.top-mr.top)/curK+11};}
function initState(){
  track.innerHTML='';offset=0;setOffset(0,false);fi=0;
  track.appendChild(makeRow(nextFile(),false));
  track.appendChild(makeRow(nextFile(),false));
  moveCursor(120,60,1,0);
}
async function loop(){
  await sleep(600);
  while(true){
    const t=targetXY();
    moveCursor(t.x,t.y,1,700);await sleep(780);
    moveCursor(t.x,t.y,0.82,120);uploadBtn.classList.add('flash');
    ripple.style.left='15px';ripple.style.top='50%';ripple.classList.remove('go');void ripple.offsetWidth;ripple.classList.add('go');
    await sleep(150);moveCursor(t.x,t.y,1,140);
    await sleep(200);uploadBtn.classList.remove('flash');
    const nrow=makeRow(nextFile(),true);track.appendChild(nrow);
    offset+=ROW_H;setOffset(offset,true);await sleep(520);
    track.removeChild(track.firstChild);offset-=ROW_H;setOffset(offset,false);
    moveCursor(t.x+64,t.y-34,1,600);
    await processRow(nrow);
    await sleep(1100);
  }
}
modal.addEventListener('mouseenter',()=>{paused=true;modal.classList.add('paused');});
modal.addEventListener('mouseleave',()=>{paused=false;modal.classList.remove('paused');});
fit();initState();loop();
</script>
<script>
/* Skickar hjulet vidare till värdsidan (Lenis via SevrEmbed) så att scrollen inte
   hackar när muspekaren står över embedden. Aktiveras FÖRST efter handskakning —
   utan värd rör vi inte scrollen alls. */
(function(){
  var host=false;
  window.addEventListener('message',function(e){
    var d=e&&e.data; if(d&&d.source==='sevr-host'&&d.type==='ready') host=true;
  });
  window.addEventListener('wheel',function(e){
    if(!host) return;
    e.preventDefault();
    try{parent.postMessage({source:'sevr-embed',type:'wheel',deltaY:e.deltaY},'*');}catch(err){}
  },{passive:false});
})();
</script>
</body>
</html>
