        var scen = document.getElementById("scen");

        var animation = lottie.loadAnimation({
          container: scen,
          renderer: RENDERARE,
          loop: LOOPA,
          autoplay: false,
          animationData: window.__ANIMATIONSDATA__,
          rendererSettings:
            RENDERARE === "canvas"
              ? {
                  preserveAspectRatio: "xMidYMid meet",
                  clearCanvas: true,
                  // Tak pa 2 halller ytan rimlig aven pa skarmar med hogre dpr.
                  dpr: Math.min(window.devicePixelRatio || 1, 2),
                }
              : { preserveAspectRatio: "xMidYMid meet", progressiveLoad: false },
        });
        animation.setSpeed(HASTIGHET);

        // Respektera operativsystemets installning for reducerad rorelse:
        // visa slutbilden i stallet for att animera.
        var reduceradRorelse =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (reduceradRorelse) {
          animation.addEventListener("DOMLoaded", function () {
            animation.goToAndStop(animation.totalFrames - 1, true);
          });
          return;
        }

        animation.play();

        if (!SPELA_I_VY || typeof IntersectionObserver === "undefined") return;

        // Spelar som utgangslage och pausas forst nar betraktaren rapporterar
        // att embedden ar utanfor vyn. Uteblir rapporten - vissa inbaddade
        // webbvyer levererar den aldrig - fortsatter den spela i stallet for
        // att fastna i pauslage.
        var betraktare = new IntersectionObserver(
          function (poster) {
            poster.forEach(function (post) {
              if (post.isIntersecting) animation.play();
              else if (PAUSA_UTANFOR) animation.pause();
            });
          },
          { threshold: SYNLIG_ANDEL }
        );
        betraktare.observe(scen);
      })();
    </script>
  <script>
/* Skickar hjulet vidare till vardsidan (Lenis via SevrEmbed) sa att scrollen inte
   hackar nar muspekaren star over embedden. Aktiveras FORST efter handskakning. */
(function(){
  var host=false;
  window.addEventListener('message',function(e){
    var d=e&&e.data; if(d&&d.source==='sevr-host'&&d.type==='ready') host=true;
  });
  window.addEventListener('wheel',function(e){
    if(!host) return;
    e.preventDefault();
    try{parent.postMessage({source:'sevr-embed',type:'wheel',deltaY:e.deltaY},'*');}catch(err){}
  },{passive:false});
})();
</script>
