      #scen {
        --d: 10.010s;

        width: 100%;
        aspect-ratio: 1440 / 1440;

        margin: 0 auto;
      }
      #scen svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* Scenen ar klippt till kompositionens ruta, precis som originalet. */
      #ruta {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #scen g {
        transform-origin: 0 0;
        transform-box: view-box;
      }

           SPELA_OM_I_VY true = borjar om nar embedden scrollas in i vyn igen
           SYNLIG_ANDEL  hur stor del av embedden som maste synas (0-1)
           HASTIGHET     1 = originalhastighet, 0.5 = halva farten
        ───────────────────────────────────────────────────────────────── */
        var LOOPA = false;
        var SPELA_OM_I_VY = true;
        var SYNLIG_ANDEL = 0.25;
        var HASTIGHET = 1;

        var scen = document.getElementById("scen");

        if (LOOPA) scen.style.setProperty("--varv", "infinite");
        if (HASTIGHET !== 1) {
          var langd = parseFloat(getComputedStyle(scen).getPropertyValue("--d"));
          scen.style.setProperty("--d", langd / HASTIGHET + "s");
        }

        // Respektera operativsystemets installning for reducerad rorelse.
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          scen.classList.add("stillbild");
          return;
        }

        if (typeof IntersectionObserver === "undefined") return;

        // Animationen spelar som utgangslage och pausas forst nar betraktaren
        // rapporterar att embedden ar utanfor vyn. Uteblir rapporten - vissa
        // inbaddade webbvyer levererar den aldrig - fortsatter den spela i
        // stallet for att fastna i pauslage.
        var varUte = false;
        var betraktare = new IntersectionObserver(
          function (poster) {
            poster.forEach(function (post) {
              scen.classList.toggle("pausad", !post.isIntersecting);
              if (!post.isIntersecting) { varUte = true; return; }
              if (varUte && SPELA_OM_I_VY && !LOOPA) {
                varUte = false;
                scen.classList.add("omstart");
                void scen.offsetWidth; // tvingar fram en omrakning
                scen.classList.remove("omstart");
              }
            });
          },
          { threshold: SYNLIG_ANDEL }
        );
        betraktare.observe(scen);
      })();
    </script>
  <script>
/* Skickar hjulet vidare till vardsidan (Lenis via SevrEmbed) sa att scrollen inte
   hackar nar muspekaren star over embedden. Aktiveras FORST efter handskakning. */
(function(){
  var host=false;
  window.addEventListener('message',function(e){
    var d=e&&e.data; if(d&&d.source==='sevr-host'&&d.type==='ready') host=true;
  });
  window.addEventListener('wheel',function(e){
    if(!host) return;
    e.preventDefault();
    try{parent.postMessage({source:'sevr-embed',type:'wheel',deltaY:e.deltaY},'*');}catch(err){}
  },{passive:false});
})();
</script>
