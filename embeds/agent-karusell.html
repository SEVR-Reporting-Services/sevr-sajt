<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agenter · karusell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="sevr-fx">
:root{
  /* ---------- duk ---------- */
  --card-w:680px;
  --card-h:440px;
  --pad:30px;

  /* ---------- tokens ur index.css (ljust) ---------- */
  --card:#ffffff;
  --background:#ffffff;
  --foreground:#030712;
  --muted:#f1f5f9;
  --muted-foreground:#64748b;
  --accent:#e2e8f0;
  --border:#e2e8f0;
  --input:#f8fafc;
  --primary:#1d4ed8;
  --ring-c:#cbd5e1;

  --chart-1:#14b8a6;
  --chart-2:#0ea5e9;
  --chart-3:#ed568b;
  --chart-4:#8b5cf6;
  --chart-5:#6366f1;
  --chart-6:#ff6900;

  /* ---------- kortet, samma matt som i Agentpanelen ---------- */
  --kort-w:284px;
  --kort-h:154px;
  --kort-r:16px;
  --ikon:46px;
  --ikon-r:15px;

  /* ---------- fart ---------- */
  --fart-a:34s;      /* ovre raden */
  --fart-b:42s;      /* undre raden, medvetet osynkad */
  --fart-c:56s;      /* remsan med kommande agenter */

  /* ---------- typografi, samma som Agentpanelen ---------- */
  --t-namn:15px;
  --t-desc:12.5px;
  --t-tagg:10.5px;
  --t-status:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--foreground);display:flex;align-items:flex-start;justify-content:flex-start;
  -webkit-font-smoothing:antialiased}
#scale{transform-origin:top left}

.duk{position:relative;width:var(--card-w);height:var(--card-h);
  padding:24px 0;display:flex;flex-direction:column;gap:14px;justify-content:center}

/* Spåret tonar ut i kanterna — korten ska aldrig kapas tvärt. */
.spar{
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
}
.band{display:flex;gap:16px;width:max-content;will-change:transform}
/* Innehållet ligger dubblerat, så -50 % är exakt ett varv. */
@keyframes glid{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
#bandA{animation:glid var(--fart-a) linear infinite}
/* negativ delay = raderna startar pa olika stallen och speglar aldrig varandra */
#bandB{animation:glid var(--fart-b) linear infinite reverse;animation-delay:-11s}
#bandC{animation:glid var(--fart-c) linear infinite;animation-delay:-7s}

/* ---------- agentkortet ---------- */
.kort{
  width:var(--kort-w);height:var(--kort-h);flex:none;
  background:var(--card);border:1px solid var(--border);border-radius:var(--kort-r);
  padding:15px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.topp{display:flex;align-items:flex-start;gap:12px}
.namn{font-size:var(--t-namn);font-weight:600;line-height:1.25}
.desc{font-size:var(--t-desc);line-height:1.42;color:var(--muted-foreground);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.taggar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tagg{font-size:var(--t-tagg);font-weight:600;border-radius:6px;padding:3px 7px;letter-spacing:.01em}
.tagg.grå{background:var(--muted);color:var(--muted-foreground)}

.status{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:var(--t-status);
  color:var(--muted-foreground);padding-top:9px;border-top:1px solid var(--border)}
.status b{color:var(--foreground);font-weight:650}
.status .bock{width:13px;height:13px;flex:none;stroke:#16a34a;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.status .klocka{width:13px;height:13px;flex:none;stroke:var(--ring-c);stroke-width:2;fill:none}

/* ---------- punktikonen, ur SevrDotIcon ----------
   6x6 punkter, 4 px, 2 px mellanrum. Släckt punkt = 20 % av kulören
   mot kortets bakgrund, tänd = full kulör. Exakt som i appen.        */
.doticon{
  display:grid;grid-template-columns:repeat(6,4px);gap:2px;
  justify-content:center;align-content:center;
  width:var(--ikon);height:var(--ikon);flex:none;border-radius:var(--ikon-r);
  background:color-mix(in srgb, var(--cat) 8%, var(--card));
}
.doticon i{width:4px;height:4px;border-radius:9999px;display:block;
  background:color-mix(in srgb, var(--cat) 20%, var(--card))}
.doticon i.on{background:var(--cat)}

/* ---------- remsan med kommande agenter ---------- */
.snart{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  background:var(--card);border:1px solid var(--border);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:500;color:#334155;white-space:nowrap;
}
.snart .prick{width:6px;height:6px;border-radius:50%;background:var(--ring-c);flex:none}
.snart em{font-style:normal;color:var(--muted-foreground);font-size:11px;font-weight:600}
</style>
</head>
<body>
<div id="scale">
  <div class="duk" id="duk">
    <div class="spar"><div class="band" id="bandA"></div></div>
    <div class="spar"><div class="band" id="bandB"></div></div>
    <div class="spar"><div class="band" id="bandC"></div></div>
  </div>
</div>

<script>
var ZOOM = 1, CARD_W = 680, CARD_H = 440;
function fit(){
  var k = (window.innerWidth / CARD_W) * ZOOM;
  document.getElementById('scale').style.transform = 'scale(' + k + ')';
  document.body.style.height = (CARD_H * k) + 'px';
}
fit(); addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ── de sex agenterna, hämtade ur Agentpanelen (d3y) ──────────────────
   Namn, beskrivning, taggar, kulör och punktmask är avlästa direkt ur
   den publicerade panelen — inget är påhittat.
   Masken är 6x6: 1 = tänd punkt (full kulör), 0 = släckt (20 %).      */
var AGENTER = [
  { namn:'Avvikelsegranskning', cat:'var(--chart-5)',
    desc:'Granskar alla verifikat och flaggar avvikelser du bör titta på.',
    taggar:[['Redovisning','var(--chart-5)'],['AI','grå']],
    status:['klocka','Inte körd än'],
    mask:'001100011110101101101101010010001100' },

  { namn:'Månadsstängning', cat:'var(--chart-5)',
    desc:'Kör månadsbokslutets kontroller och ger ett omdöme.',
    taggar:[['Redovisning','var(--chart-5)']],
    status:['klocka','<b>8 av 12</b> kontroller klara'],
    mask:'010010111111100001101101101101111111' },

  { namn:'Årsbokslut', cat:'var(--chart-5)',
    desc:'Bokför årets avslut till färdiga verifikat efter dina bedömningar.',
    taggar:[['Redovisning','var(--chart-5)']],
    status:['bock','<b>42</b> verifikat bokförda'],
    mask:'110011111111101101101101111111110011' },

  { namn:'Momsdeklaration', cat:'var(--chart-6)',
    desc:'Bygger hela momsdeklarationen och stämmer av mot bokföringen.',
    taggar:[['Skatt','var(--chart-6)'],['Beta','grå']],
    status:['klocka','Stämmer av moms · apr–jun'],
    mask:'110001110010000100001000010011100011' },

  { namn:'Verifikatanalys', cat:'var(--chart-4)',
    desc:'Testar hela verifikatpopulationen — inget stickprov.',
    taggar:[['Revision','var(--chart-4)']],
    status:['bock','<b>12 480</b> verifikat testade'],
    mask:'011110111111011110111111011110111111' },

  { namn:'Koncernkonsolidering', cat:'var(--chart-5)',
    desc:'Konsoliderar koncernen och eliminerar interna mellanhavanden.',
    taggar:[['Redovisning','var(--chart-5)'],['Beta','grå']],
    status:['klocka','Redo att köra'],
    mask:'111100100100101111111101001001001111' }
];

/* ── "Kommer snart", ordagrant ur panelens sidolista ─────────────────── */
var SNART = ['Årsredovisning','Inkomstdeklaration · INK2','Väsentlighet & risk',
             'Fortsatt drift · going concern','FP&A-agenten','Bolagsvärdering · DCF',
             'Styrelserapportering','Lönekörning'];

var BOCK   = '<svg class="bock" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
var KLOCKA = '<svg class="klocka" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function doticon(a){
  var p = '';
  for (var i = 0; i < 36; i++) p += '<i class="' + (a.mask[i] === '1' ? 'on' : '') + '"></i>';
  return '<span class="doticon" style="--cat:' + a.cat + '">' + p + '</span>';
}

function kort(a){
  var taggar = a.taggar.map(function(t){
    return t[1] === 'grå'
      ? '<span class="tagg grå">' + t[0] + '</span>'
      : '<span class="tagg" style="background:color-mix(in srgb,' + t[1] + ' 12%, var(--card));color:' + t[1] + '">' + t[0] + '</span>';
  }).join('');
  return '<div class="kort">' +
    '<div class="topp">' + doticon(a) +
      '<div><div class="namn">' + a.namn + '</div><div class="desc">' + a.desc + '</div></div>' +
    '</div>' +
    '<div class="taggar">' + taggar + '</div>' +
    '<div class="status">' + (a.status[0] === 'bock' ? BOCK : KLOCKA) + '<span>' + a.status[1] + '</span></div>' +
  '</div>';
}

function snartChip(namn){
  return '<span class="snart"><span class="prick"></span>' + namn + '<em>Kommer snart</em></span>';
}

/* Två varv av samma innehåll ⇒ -50 % blir en sömlös loop.
   Undre raden startar på en annan agent så raderna aldrig speglar varandra. */
function fyll(id, html){
  document.getElementById(id).innerHTML = html + html;
}
var radA = AGENTER;
var radB = AGENTER.slice(3).concat(AGENTER.slice(0, 3));

fyll('bandA', radA.map(kort).join(''));
fyll('bandB', radB.map(kort).join(''));
fyll('bandC', SNART.map(snartChip).join(''));
</script>
</body>
</html>
