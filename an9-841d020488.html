      :root {
        --vit: #ffffff;
        --pill: #fafafa;
        --kant: #e2e8f0;
        --text: #030712;
        --dammig: #64748b;
        --handtag: #94a3b8;
        --violett: #8b5cf6;
        --rosa: #e80869;
        --teal: #14b8a6;
        --himmel: #0ea5e9;
        --mjuk: cubic-bezier(0.22, 1, 0.36, 1);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent; /* genomskinlig bakgrund */
        overflow: hidden;
      }

      #scen {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        max-height: 100%;
        margin: 0 auto;
        font-family: "Rapport", ui-sans-serif, system-ui, sans-serif;
        font-weight: 400;
        color: var(--text);
      }
      #scenrum {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1440px;
        transform-origin: 0 0;
        transform: scale(var(--k, 1));
      }

      /* ── Valfri bakgrundsgradient (klassen "med-bakgrund" pa #scen) ─────── */
      .bakgrund {
        display: none;
      }
      #scen.med-bakgrund .bakgrund {
        display: block;
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1900px;
        height: 1900px;
        margin: -950px 0 0 -950px;
        border-radius: 640px;
        background: linear-gradient(135deg, var(--teal), var(--himmel));
        filter: blur(30px);
        animation: snurra-bakgrund 10s linear infinite;
      }
      @keyframes snurra-bakgrund {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Kamera ────────────────────────────────────────────────────────── */
      .kamera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        animation: kamera 10s var(--mjuk) infinite both;
      }
      @keyframes kamera {
        0%,
        3.5% {
          transform: translate(-70px, 80px) scale(0.46);
          animation-timing-function: cubic-bezier(0.65, 0, 0.3, 1);
        }
        14% {
          transform: translate(0, 0) scale(1);
        }
        88% {
          transform: translate(-14px, -10px) scale(1.035);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        100% {
          transform: translate(-70px, 80px) scale(0.46);
        }
      }

      /* ── Kortet ────────────────────────────────────────────────────────── */
      .kort {
        position: absolute;
        left: 40px;
        top: 40px;
        width: 1360px;
        height: 1360px;
        border-radius: 44px;
        background: var(--vit);
        overflow: hidden;
        box-shadow:
          0 4px 14px rgba(3, 7, 18, 0.05),
          0 44px 90px rgba(3, 7, 18, 0.16);
      }

      /* ── Diagram ───────────────────────────────────────────────────────── */
      .diagram {
        position: absolute;
        left: -40px;
        top: -40px;
        width: 1440px;
        height: 1440px;
      }
      .stapel {
        fill: var(--violett);
      }
      .trend {
        fill: none;
        stroke: var(--text);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nod {
        fill: var(--vit);
        stroke: var(--text);
        stroke-width: 5;
      }
      .axel-y,
      .axel-x {
        fill: var(--text);
        font-family: "Rapport", ui-sans-serif, system-ui, sans-serif;
        font-size: 34px;
      }
      .axel-x {
        font-size: 31px;
        letter-spacing: -0.01em;
      }

      /* ── Verktygsrad ───────────────────────────────────────────────────── */
      .verktygsrad-plats {
        position: absolute;
        left: 50%;
        top: 80px;
        width: 820px;
        margin-left: -410px;
      }
      .verktygsrad {
        display: flex;
        align-items: center;
        gap: 26px;
        height: 132px;
        padding: 0 30px;
        border: 2px solid var(--kant);
        border-radius: 36px;
        background: var(--pill);
        box-shadow: 0 2px 10px rgba(3, 7, 18, 0.04);
        transform-origin: 50% 50%;
        animation: klicktryck 10s var(--mjuk) infinite both;
      }
      @keyframes klicktryck {
        0%,
        15.2% {
          transform: scale(1);
        }
        16.1% {
          transform: scale(0.972);
        }
        17.4%,
        100% {
          transform: scale(1);
        }
      }

      .handtag {
        display: grid;
        grid-template-columns: repeat(2, 9px);
        gap: 8px 9px;
        flex: none;
      }
      .handtag i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--handtag);
      }
      .avdelare {
        width: 2px;
        height: 58px;
        background: var(--kant);
        flex: none;
      }

      .etiketter {
        position: relative;
        flex: 1;
        align-self: stretch;
      }
      .etikett {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 52px;
        font-weight: 550;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .etikett-a {
        animation: etikett-a 10s var(--mjuk) infinite both;
      }
      .etikett-b {
        animation: etikett-b 10s var(--mjuk) infinite both;
      }
      .etikett-c {
        animation: etikett-c 10s var(--mjuk) infinite both;
      }
      /* Texten byts med en kort suddig overtoning, som i originalet. */
      @keyframes etikett-a {
        0%,
        16.2% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        18.2%,
        92.8% {
          opacity: 0;
          transform: translateY(-14px);
          filter: blur(6px);
        }
        96.2%,
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes etikett-b {
        0%,
        16.2% {
          opacity: 0;
          transform: translateY(14px);
          filter: blur(6px);
        }
        18.2%,
        43% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        45.4%,
        100% {
          opacity: 0;
          transform: translateY(-14px);
          filter: blur(6px);
        }
      }
      @keyframes etikett-c {
        0%,
        43% {
          opacity: 0;
          transform: translateY(14px);
          filter: blur(6px);
        }
        45.4%,
        91.5% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        94%,
        100% {
          opacity: 0;
          transform: translateY(-14px);
          filter: blur(6px);
        }
      }
      /* Gnistan i "Klart" studsar in nar sammanfattningen ar fardig. */
      .etikett-c .gnista {
        transform-origin: 50% 50%;
        animation: gnista-in 10s var(--mjuk) infinite both;
      }
      @keyframes gnista-in {
        0%,
        43.4% {
          transform: scale(0.2) rotate(-90deg);
        }
        47.5%,
        100% {
          transform: scale(1) rotate(0deg);
        }
      }

      .knappar {
        display: flex;
        align-items: center;
        gap: 26px;
        flex: none;
      }
      .ikon {
        width: 46px;
        height: 46px;
        flex: none;
        display: block;
      }
      .gnista {
        fill: var(--text);
      }
      .kugg {
        fill: var(--dammig);
      }
      .korg {
        fill: none;
        stroke: var(--rosa);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .snurra {
        fill: none;
        stroke: var(--dammig);
        stroke-width: 3.4;
        stroke-linecap: round;
        animation: snurr 0.9s linear infinite;
      }
      @keyframes snurr {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Muspekare ─────────────────────────────────────────────────────── */
      .pekare {
        position: absolute;
        left: 0;
        top: 0;
        width: 84px;
        height: 84px;
        animation: pekare 10s var(--mjuk) infinite both;
      }
      @keyframes pekare {
        0% {
          opacity: 0;
          transform: translate(1180px, 1330px) scale(1);
        }
        6% {
          opacity: 1;
          transform: translate(1150px, 1290px) scale(1);
        }
        15.2% {
          opacity: 1;
          transform: translate(628px, 214px) scale(1);
        }
        16.1% {
          transform: translate(628px, 214px) scale(0.88);
        }
        17.4% {
          opacity: 1;
          transform: translate(628px, 214px) scale(1);
        }
        24% {
          opacity: 0;
          transform: translate(1180px, 1330px) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(1180px, 1330px) scale(1);
        }
      }

      /* ── Pausat lage (utanfor vyn) och stillbild (reducerad rorelse) ───── */
      #scen.pausad,
      #scen.pausad * {
        animation-play-state: paused !important;
      }
      #scen.stillbild *,
      #scen.stillbild {
        animation: none !important;
      }
      #scen.stillbild .kamera {
        transform: translate(0, 0) scale(1);
      }
      #scen.stillbild .etikett-a,
      #scen.stillbild .etikett-b,
      #scen.stillbild .pekare {
        opacity: 0;
      }
      #scen.stillbild .etikett-c {
        opacity: 1;
        transform: none;
        filter: none;
      }
    </style>

    <script>
      (function () {
        /* ── Installningar ──────────────────────────────────────────────
           VISA_BAKGRUND  false = genomskinlig bakgrund (som nu),
                          true  = turkos/bla gradient bakom kortet
           SPELA_I_VY     true = animationen startar nar embedden syns
           SYNLIG_ANDEL   hur stor del av embedden som maste synas (0-1)
           HASTIGHET      1 = originalhastighet, 0.5 = halva farten
        ───────────────────────────────────────────────────────────────── */
        var VISA_BAKGRUND = false;
        var SPELA_I_VY = true;
        var SYNLIG_ANDEL = 0.25;
        var HASTIGHET = 1;

        var scen = document.getElementById("scen");
        var rum = document.getElementById("scenrum");

        if (VISA_BAKGRUND) scen.classList.add("med-bakgrund");
        if (HASTIGHET !== 1) {
          scen.querySelectorAll("*").forEach(function (el) {
            var d = getComputedStyle(el).animationDuration;
            if (d && d !== "0s") {
              el.style.animationDuration = d
                .split(",")
                .map(function (v) {
                  return parseFloat(v) / HASTIGHET + "s";
                })
                .join(",");
            }
          });
        }

        // Skalar scenrummet (1440 x 1440) till embeddens faktiska bredd.
        function skala() {
          rum.style.setProperty("--k", scen.clientWidth / 1440);
        }
        skala();
        if (typeof ResizeObserver !== "undefined") new ResizeObserver(skala).observe(scen);
        else window.addEventListener("resize", skala);

        // Respektera operativsystemets installning for reducerad rorelse.
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          scen.classList.add("stillbild");
          return;
        }

        if (!SPELA_I_VY || typeof IntersectionObserver === "undefined") return;

        // Animationen spelar som utgangslage och pausas forst nar betraktaren
        // rapporterar att embedden ar utanfor vyn. Uteblir rapporten - vissa
        // inbaddade webbvyer levererar den aldrig - fortsatter den spela i
        // stallet for att fastna i pauslage.
        var betraktare = new IntersectionObserver(
          function (poster) {
            poster.forEach(function (post) {
              scen.classList.toggle("pausad", !post.isIntersecting);
            });
          },
          { threshold: SYNLIG_ANDEL }
        );
        betraktare.observe(scen);
      })();
    </script>
  <script>
/* Skickar hjulet vidare till vardsidan (Lenis via SevrEmbed) sa att scrollen inte
   hackar nar muspekaren star over embedden. Aktiveras FORST efter handskakning. */
(function(){
  var host=false;
  window.addEventListener('message',function(e){
    var d=e&&e.data; if(d&&d.source==='sevr-host'&&d.type==='ready') host=true;
  });
  window.addEventListener('wheel',function(e){
    if(!host) return;
    e.preventDefault();
    try{parent.postMessage({source:'sevr-embed',type:'wheel',deltaY:e.deltaY},'*');}catch(err){}
  },{passive:false});
})();
</script>
